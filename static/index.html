<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrugForge — Virtual Screening Lab</title>
    <script src="https://3dmol.csb.pitt.edu/build/3Dmol-min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: #f8f9fa; color: #212529; }
        .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
        h1 { margin-bottom: 0.25rem; }
        .subtitle { color: #6c757d; margin-bottom: 2rem; font-size: 0.9rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
        input, select { width: 100%; padding: 0.5rem; border: 1px solid #ced4da; border-radius: 4px; }
        button { padding: 0.6rem 1.5rem; background: #0d6efd; color: #fff; border: none;
                 border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:disabled { background: #6c757d; cursor: wait; }
        .results { margin-top: 2rem; display: none; }
        .badge { display: inline-block; padding: 0.3rem 0.8rem; border-radius: 12px;
                 font-weight: 700; font-size: 0.85rem; }
        .badge-promising { background: #d1e7dd; color: #0f5132; }
        .badge-comparable { background: #fff3cd; color: #664d03; }
        .badge-weaker { background: #f8d7da; color: #842029; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.5rem; border-bottom: 1px solid #dee2e6; text-align: left; }
        th { background: #e9ecef; }
        #viewer { width: 100%; height: 400px; border: 1px solid #dee2e6; margin-top: 1rem; }
        .spinner { display: none; margin-left: 1rem; }
        .error { color: #dc3545; margin-top: 1rem; display: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>DrugForge</h1>
    <p class="subtitle">
        In-silico molecular docking for neglected tropical diseases.
        Results are computational predictions only — not clinical advice.
    </p>

    <div class="form-group">
        <label for="molecule">Molecule (name or SMILES)</label>
        <input type="text" id="molecule" placeholder="e.g. artemisinin or CCO">
    </div>
    <div class="form-group">
        <label for="target">Target</label>
        <select id="target"></select>
    </div>
    <div class="form-group">
        <label for="exhaustiveness">Exhaustiveness (1-32)</label>
        <input type="range" id="exhaustiveness" min="1" max="32" value="8">
        <span id="exh-val">8</span>
    </div>
    <button id="dock-btn" onclick="submitDock()">Dock</button>
    <span class="spinner" id="spinner">Docking... please wait (~10-60s)</span>
    <div class="error" id="error"></div>

    <div class="results" id="results">
        <h2>Results <span id="verdict-badge" class="badge"></span></h2>
        <p><strong>Affinity:</strong> <span id="affinity"></span> kcal/mol</p>
        <h3>Comparison to Reference</h3>
        <table id="comparison-table">
            <thead><tr><th>Metric</th><th>Molecule</th><th>Reference</th><th>Delta</th><th>Verdict</th></tr></thead>
            <tbody></tbody>
        </table>
        <h3>3D Pose</h3>
        <div id="viewer"></div>
    </div>
</div>

<script>
    const exhSlider = document.getElementById('exhaustiveness');
    exhSlider.oninput = () => document.getElementById('exh-val').textContent = exhSlider.value;

    // Load targets on page load
    fetch('/api/targets').then(r => r.json()).then(targets => {
        const sel = document.getElementById('target');
        targets.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t.id;
            opt.textContent = `${t.name} (${t.disease})`;
            sel.appendChild(opt);
        });
    });

    async function submitDock() {
        const btn = document.getElementById('dock-btn');
        const spinner = document.getElementById('spinner');
        const errorDiv = document.getElementById('error');
        const resultsDiv = document.getElementById('results');

        btn.disabled = true;
        spinner.style.display = 'inline';
        errorDiv.style.display = 'none';
        resultsDiv.style.display = 'none';

        try {
            const resp = await fetch('/api/dock', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    molecule: document.getElementById('molecule').value,
                    target_id: document.getElementById('target').value,
                    exhaustiveness: parseInt(exhSlider.value),
                }),
            });

            if (!resp.ok) {
                const err = await resp.json();
                throw new Error(err.detail?.detail || err.detail || 'Docking failed');
            }

            const data = await resp.json();
            displayResults(data);
        } catch (e) {
            errorDiv.textContent = e.message;
            errorDiv.style.display = 'block';
        } finally {
            btn.disabled = false;
            spinner.style.display = 'none';
        }
    }

    function displayResults(data) {
        const resultsDiv = document.getElementById('results');
        document.getElementById('affinity').textContent = data.affinity_kcal_mol.toFixed(2);

        const badge = document.getElementById('verdict-badge');
        badge.textContent = data.verdict;
        badge.className = 'badge badge-' + data.verdict.toLowerCase();

        // Comparison table
        const tbody = document.querySelector('#comparison-table tbody');
        tbody.innerHTML = '';
        data.comparisons.forEach(c => {
            const row = document.createElement('tr');
            row.innerHTML = `<td>${c.metric}</td><td>${c.molecule_value.toFixed(2)}</td>` +
                `<td>${c.reference_value.toFixed(2)}</td><td>${c.delta.toFixed(2)}</td>` +
                `<td>${c.verdict}</td>`;
            tbody.appendChild(row);
        });

        // 3D viewer
        const viewer = $3Dmol.createViewer('viewer', {backgroundColor: 'white'});
        if (data.pose_sdf) {
            viewer.addModel(data.pose_sdf, 'sdf');
            viewer.setStyle({}, {stick: {colorscheme: 'Jmol'}});
            viewer.zoomTo();
            viewer.render();
        }

        resultsDiv.style.display = 'block';
    }
</script>
</body>
</html>
