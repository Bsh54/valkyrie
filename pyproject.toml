[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drugforge"
version = "0.2.0"
description = "Molecular docking laboratory for neglected tropical diseases"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
keywords = ["docking", "cheminformatics", "malaria", "virtual-screening"]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "requests>=2.31",
    "rdkit>=2023.9",
    "meeko>=0.5",
    "vina>=1.2.5",
    "scipy>=1.11",
    "gemmi>=0.6",
    "numpy>=1.26",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.98",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
drugforge = "drugforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: requires a docking engine run (deselect with -m 'not slow')",
    "property: property-based test",
    "network: reaches an external service",
]

[tool.ruff]
line-length = 95
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]
